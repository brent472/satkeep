[workspace]
resolver = "3"
members = ["crates/twofold-savings"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# miniscript and bitcoin are used through bdk_wallet's re-exports so their
# versions always match the ones BDK was built against.
bdk_wallet = "3.2.0"
bdk_bitcoind_rpc = "0.22.1"
thiserror = "2.0.21"

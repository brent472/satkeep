[package]
name = "satkeep-backup"
version = "0.1.0"
description = "The Satkeep phone key backup and exit kit formats: parse, unlock and make. Test networks only."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The software security device, for tests and the prototype. Release builds
# of the restore tool leave it out.
simulated-device = []

[dependencies]
bip39 = { version = "2.2.2", default-features = false, features = ["std", "zeroize"] }
# getrandom: the operating system's generator for data keys, nonces and
# wallet ids (RustCrypto's `Generate`). zeroize: the cipher wipes its key
# when dropped, as 0.10 always did; from 0.11 it's a feature.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
thiserror.workspace = true
zeroize = "1.9.1"

[dev-dependencies]
satkeep-backup = { path = ".", features = ["simulated-device"] }

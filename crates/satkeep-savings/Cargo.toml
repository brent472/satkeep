[package]
name = "satkeep-savings"
version = "0.1.0"
description = "The Satkeep Savings wallet policy: 2 of 3 keys, with delayed device and heir paths"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bdk_wallet.workspace = true
bip39 = { version = "2.2.2", default-features = false, features = ["std", "zeroize"] }
# The backup format; the simulated device for the prototype and its tests.
satkeep-backup = { path = "../satkeep-backup", features = ["simulated-device"] }
thiserror.workspace = true
zeroize = "1.9.1"

[dev-dependencies]
bdk_bitcoind_rpc.workspace = true
rand = "0.8.5"
serde_json = "1.0"
satkeep-testenv = { path = "../satkeep-testenv" }

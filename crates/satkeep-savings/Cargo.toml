[package]
name = "satkeep-savings"
version = "0.1.0"
description = "The Satkeep Savings wallet policy: 2 of 3 keys, with delayed device and heir paths"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The software security device, for the prototype's tests and fuzzing. The
# CLI, and any release build, leaves it out.
simulated-device = ["satkeep-backup/simulated-device"]

[dependencies]
bdk_wallet.workspace = true
bip39 = { version = "2.2.2", default-features = false, features = ["std", "zeroize"] }
# The backup format.
satkeep-backup = { path = "../satkeep-backup" }
thiserror.workspace = true
zeroize = "1.9.1"

[dev-dependencies]
satkeep-savings = { path = ".", features = ["simulated-device"] }
bdk_bitcoind_rpc.workspace = true
rand = "0.8.5"
serde_json = "1.0"
satkeep-testenv = { path = "../satkeep-testenv" }

# cargo-deny policy for Satkeep. Run `cargo deny check`; CI runs it on every
# PR. A new dependency needs a reason in its PR (see the README).

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory that affects a crate we use: vulnerabilities,
# unsound code and unmaintained crates, plus any yanked version.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# An advisory may only be ignored here with a reason, in a reviewed PR.
ignore = [
    # Yanked, not an advisory. On 2026-10-25 RustCrypto yanked every
    # crypto-bigint 0.7 release except 0.7.9, published that day, because
    # 0.7.9 makes a breaking fix: the blanket `Mul` for `NonZero<T>` lacked a
    # `T: Integer` bound, so a non-zero modular number times another could
    # claim to be non-zero when it was zero
    # (https://github.com/RustCrypto/crypto-bigint/pull/1373). Nothing here
    # multiplies two `NonZero` values: in the second phone's p256 chain,
    # `NonZero` appears only in p256's hash2curve module (not built) and its
    # tests. 0.7.7 stays until 0.7.9 is 14 days old, 2026-11-08; then move to
    # 0.7.9 and remove this entry.
    { crate = "crypto-bigint@0.7.7", reason = "yanked for the 0.7.9 breaking fix (crypto-bigint#1373), whose code p256 doesn't use; move to 0.7.9 on 2026-11-08" },
]

[bans]
# Duplicates are reported. For the crates that hold keys and build
# transactions, two versions in the build is an error: types from one don't
# fit the other, and it means part of the code runs older crypto.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates refer to each other by path; they're never published.
allow-wildcard-paths = true
deny = [
    { crate = "bitcoin", deny-multiple-versions = true, reason = "builds and signs transactions" },
    { crate = "secp256k1", deny-multiple-versions = true, reason = "holds and uses private keys" },
    { crate = "miniscript", deny-multiple-versions = true, reason = "decides which spending path is valid" },
]

[sources]
# crates.io only: no git dependencies and no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Permissive licences only, compatible with Satkeep's MIT licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9
exceptions = [
    # MIT plus a no-false-attribution clause; still permissive.
    { crate = "hex_lit", allow = ["MITNFA"] },
    # BSD 3-clause; constant-time helpers used by the P-256 crates behind the
    # second phone (crypto-bigint, elliptic-curve, ff, group). Permissive.
    { crate = "subtle", allow = ["BSD-3-Clause"] },
]

# Checks on every pull request (and on main). Regtest only; nothing here
# prints key material: tests generate throwaway keys and check their own
# output for private keys, and the fuzz targets print nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_FUZZ_VERSION: "0.13.2"
  # Same pins as exit-drill.yml.
  CORE_VERSION: "31.1"
  CORE_TARBALL_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
  CORE_MIN_SIGNATURES: "3"

jobs:
  build:
    name: Build, clippy, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings
      - run: cargo test --workspace --lib --locked

  deny:
    name: cargo deny check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny (checked against its published SHA256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}"
          curl -sSfL -o "$f" "$base/$f"
          curl -sSfL -o "$f.sha256" "$base/$f.sha256"
          expected=$(cut -d' ' -f1 "$f.sha256" | tr -d '\r\n' | tr 'A-F' 'a-f')
          echo "${expected}  $f" | sha256sum -c -
          tar xzf "$f"
          install "$(find . -name cargo-deny -type f | head -1)" "$HOME/.cargo/bin/cargo-deny"
      - run: cargo deny check

  regtest:
    name: Regtest tests (throwaway nodes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Bitcoin Core and verify it against its signed checksums
        run: .github/scripts/fetch-bitcoin-core.sh
      # Every test except the full-length 61,320-block one, which is
      # #[ignore]d and stays a local, before-release run.
      - run: cargo test --workspace --locked

  fuzz:
    name: Fuzz ${{ matrix.target }} (60 s)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [psbt, config, holder_key]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -print_final_stats=1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/

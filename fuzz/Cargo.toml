[package]
name = "satkeep-fuzz"
version = "0.0.0"
description = "cargo-fuzz targets for the code that reads outside input"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the main build never compiles libFuzzer.
[workspace]
members = ["."]

[dependencies]
# Approved for the fuzz crate only. It also provides `arbitrary`.
libfuzzer-sys = "0.4.13"
bdk_wallet = "3.2.0"
serde_json = "1.0"
satkeep-backup = { path = "../crates/satkeep-backup", features = ["simulated-device"] }
satkeep-cli = { path = "../crates/satkeep-cli" }
satkeep-savings = { path = "../crates/satkeep-savings" }

[[bin]]
name = "psbt"
path = "fuzz_targets/psbt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "holder_key"
path = "fuzz_targets/holder_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_file"
path = "fuzz_targets/backup_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kit"
path = "fuzz_targets/kit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "second_phone"
path = "fuzz_targets/second_phone.rs"
test = false
doc = false
bench = false
